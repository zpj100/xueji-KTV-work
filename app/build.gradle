plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

// 完整编译大型 TV 页面时，避免继承默认 512 MiB 导致编译器反复回收内存。
kotlin {
    kotlinDaemonJvmArgs = ["-Xmx2g", "-XX:MaxMetaspaceSize=768m"]
}

android {
    namespace "com.local.ktv"
    compileSdk 35

    defaultConfig {
        applicationId "com.local.ktv"
        minSdk 14
        targetSdk 25
        // core library desugaring 在 minSdk < 21 时要求启用 multidex（AGP 硬性检查）。
        // 当前方法数约 1.3 万（单 dex），实际不会分包；开启仅为满足检查并保留 4.x 兼容。
        multiDexEnabled true
        versionCode 43
        versionName "2.4.3"

    }

    // 签名配置:使用已有的 ktv_keystore.jks
    signingConfigs {
        release {
            storeFile rootProject.file("ktv_keystore.jks")
            storePassword "123456"
            keyAlias "ktv"
            keyPassword "123456"
        }
    }

    buildTypes {
        release {
            // 正式版面向 32/64 位 ARM 电视盒子。
            ndk { abiFilters "armeabi-v7a", "arm64-v8a" }
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            applicationIdSuffix ".qa"
            // 模拟器使用原生 x86 库，避免 ARM 转译影响软件解码验证。
            ndk { abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64" }
        }
    }


    // 支持 .ts 视频文件(aapt 不压缩这些文件以避免 SoundPool/MediaPlayer 问题)
    androidResources {
        noCompress 'ts', 'mp3', 'mp4', 'aac', 'm4a', 'flac', 'wav', 'zip'
    }

    // 关闭发布构建的 lint vital 检查(本地分发的 APK 不需要 Google Play 上架要求)
    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    // 启用 BuildConfig 生成,供 AboutFragment 读取版本号/版本Code等信息
    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        // Android 4.4 (API 19) 的 Dalvik/ART 不支持 Java 8+ 字节码，
        // 必须降至 1.8 并启用核心库脱糖，否则启动时会 VerifyError/NoSuchMethodError。
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    // 产物统一命名为 xueji-ktv-<版本号>.apk
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def vn = variant.versionName ?: android.defaultConfig.versionName
            output.outputFileName = "xueji-ktv-${vn}.apk"
        }
    }

}

// Kotlin 标准库使用当前 Kotlin 插件匹配的版本。

dependencies {
    // 核心库脱糖：让 Java 8+ 标准库 API（java.time、ConcurrentHashMap 等）能在 API 19 上运行
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"

    implementation files("libs/original-ijk-runtime.jar")
    implementation "com.alphacephei:vosk-android:0.3.47"
    implementation "androidx.core:core:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    // Android 4.x（API < 21）上加载第二个 dex（脱糖库）必需
    implementation "androidx.multidex:multidex:2.0.1"
    implementation "com.google.zxing:core:3.5.3"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"

}
